name: napi-publish

on:
  push:
    tags:
      - 'napi-v*'
  workflow_dispatch:

# Least privilege by default; jobs opt into exactly what they need.
permissions: {}

env:
  DEBUG: napi:*
  APP_NAME: rolldown-zarara
  MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
  build:
    name: ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: pnpm --filter rolldown-zarara exec napi build --platform --release --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm --filter rolldown-zarara exec napi build --platform --release --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm --filter rolldown-zarara exec napi build --platform --release --target x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: pnpm --filter rolldown-zarara exec napi build --platform --release --target aarch64-unknown-linux-gnu --zig
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm --filter rolldown-zarara exec napi build --platform --release --target x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        # Must match rust-toolchain.toml (1.95.0); otherwise rustup honors the
        # toml override at build time and the cross-target std added here to a
        # different toolchain is invisible -> "can't find crate for `core`".
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.settings.target }}

      - name: Install zig
        # napi CLI v2 cross-compiles via zig as the linker (the `--zig` flag).
        if: contains(matrix.settings.build, '--zig')
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2
        with:
          version: 0.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: napi/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # create the GitHub Release + upload .node assets
      id-token: write # OIDC for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm CLI
        # Need npm >= 11.5.1 for OIDC trusted publishing
        run: npm install -g npm@latest
        shell: bash

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: napi/artifacts

      - name: Move artifacts into per-triple npm dirs
        working-directory: napi
        run: pnpm exec napi artifacts

      - name: List packages
        working-directory: napi
        run: ls -R ./npm
        shell: bash

      - name: Publish to npm
        working-directory: napi
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          # Lets `napi prepublish` create the GitHub Release and upload the
          # .node artifacts to it (requires contents: write above).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public
        shell: bash
